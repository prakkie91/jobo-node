name: Tests

on:
  pull_request:
    branches: [main, master]
  # Called by the release workflow so the test definition lives in one place.
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm test
        env:
          JOBO_API_KEY: ${{ secrets.JOBO_API_KEY }}
